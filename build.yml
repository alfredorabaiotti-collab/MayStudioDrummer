name: Build May Studio Midi Drummer

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Configura (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configura (macOS, Intel + Apple Silicon)
        if: runner.os == 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Compila
        run: cmake --build build --config Release --parallel

      - uses: actions/upload-artifact@v6
        with:
          name: MayStudioMidiDrummer-${{ runner.os }}
          path: |
            build/MayStudioMidiDrummer_artefacts/Release/VST3
            build/MayStudioMidiDrummer_artefacts/Release/AU
            build/MayStudioMidiDrummer_artefacts/Release/Standalone
